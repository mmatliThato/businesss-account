<div class="profile-table-container">
  <div *ngIf="loading" class="loading-overlay">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
    <button mat-button (click)="refresh.emit()">Retry</button>
  </div>

  <table mat-table [dataSource]="profiles" class="profile-table">
    <!-- Checkbox Column -->
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let profile"></td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let profile">{{ profile.Name }}</td>
    </ng-container>

    <!-- Phone Number ID Column -->
    <ng-container matColumnDef="phoneNumberId">
      <th mat-header-cell *matHeaderCellDef>Phone Number ID</th>
      <td mat-cell *matCellDef="let profile">{{ profile.PhoneNumberId }}</td>
    </ng-container>

    <!-- WhatsApp Number Column -->
    <ng-container matColumnDef="whatsappNumber">
      <th mat-header-cell *matHeaderCellDef>WhatsApp Number</th>
      <td mat-cell *matCellDef="let profile">{{ profile.WhatsAppNumber }}</td>
    </ng-container>

    <!-- Maintenance Message Enabled Column -->
    <ng-container matColumnDef="maintenanceMessageEnabled">
      <th mat-header-cell *matHeaderCellDef>Maintenance Msg</th>
      <td mat-cell *matCellDef="let profile">
        <span class="status-badge" [class.active]="profile.MaintenanceMessageEnabled">
          {{ profile.MaintenanceMessageEnabled ? 'Yes' : 'No' }}
        </span>
      </td>
    </ng-container>

    <!-- Active Column -->
    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef>Active</th>
      <td mat-cell *matCellDef="let profile">
        <span class="status-badge" [class.active]="profile.isActive">
          {{ profile.isActive ? 'Yes' : 'No' }}
        </span>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let profile">
        <button mat-icon-button>
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button>
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>
</div>
