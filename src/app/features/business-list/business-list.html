<div class="business-list-container">
  @if (loading()) {
    <div class="loading-overlay">
      <app-loading-spinner></app-loading-spinner>
    </div>
  }

  @if (error()) {
    <app-error-message [message]="error()!"></app-error-message>
  }

  @if (!loading() && !error()) {
    <table class="data-table">
      <thead>
        <tr>
          <th class="name-column">Name</th>
          <th class="whatsapp-column">WhatsApp Number</th>
          <th class="status-column">Status</th>
        </tr>
      </thead>
      <tbody>
        @for (business of getPaginatedData(); let i = $index; track business.Id) {
          <tr class="data-row" [class.even]="i % 2 === 0">
            <td class="name-cell">{{ business.Name }}</td>
            <td class="whatsapp-cell">{{ business.WhatsAppNumber }}</td>
            <td class="status-cell">
              <app-status-badge [isActive]="business.isActive"></app-status-badge>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
