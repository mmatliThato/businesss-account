<div class="screen-container">
  <div class="content-frame">
    <div class="page-header">
      <h1>Home</h1>
    </div>

    <app-tab-navigation [currentTab]="currentTab()" (tabSelected)="currentTab.set($event)">
    </app-tab-navigation>

    <div class="table-card">
      <div class="table-header-actions">
        <div class="search-input">
          <mat-icon>search</mat-icon>
          <input type="text" placeholder="Search" (keyup)="applyFilter($event)" />
        </div>

        <div class="action-group">
          <div class="sort-btn">
            <span>Newest to oldest</span>
            <mat-icon>expand_more</mat-icon>
          </div>

          <button class="add-btn" (click)="addProfile()">
            <mat-icon>open_in_new</mat-icon>
            <span class="btn-text">Add Profile</span>
          </button>
        </div>
      </div>

      <table mat-table [dataSource]="dataSource" class="premium-mat-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let element" class="name-column">{{ element.Name }}</td>
        </ng-container>

        <ng-container matColumnDef="accountId">
          <th mat-header-cell *matHeaderCellDef>Account ID</th>
          <td mat-cell *matCellDef="let element" class="mono-text">{{ element.Id }}</td>
        </ng-container>

        <ng-container matColumnDef="whatsapp">
          <th mat-header-cell *matHeaderCellDef>WhatsApp Number</th>
          <td mat-cell *matCellDef="let element">{{ element.WhatsAppNumber }}</td>
        </ng-container>

        <ng-container matColumnDef="phoneId">
          <th mat-header-cell *matHeaderCellDef>Phone Number ID</th>
          <td mat-cell *matCellDef="let element" class="mono-text">{{ element.PhoneNumberId }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let element">
            <span class="status-badge" [class.active]="element.isActive">
              <span class="dot"></span>
              {{ element.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu" class="custom-menu">
              <button mat-menu-item (click)="navigateToDetails(element.Id)">
                <mat-icon style="color: #0051ff">visibility</mat-icon>
                <span style="color: #697786; font-family: 'Benton Sans Pro'">View Details</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="clickable-row"
          (click)="navigateToDetails(row.Id)"
        ></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[10, 15, 20]" aria-label="Select page"></mat-paginator>
    </div>
  </div>
</div>
