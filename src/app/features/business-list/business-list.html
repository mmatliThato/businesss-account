<div class="admin-portal-list">
  <div class="screen-container">
    <div class="content-frame">
      <header class="page-header">
        <h1>Home</h1>
      </header>

      <app-tab-navigation [currentTab]="currentTab()" (tabSelected)="currentTab.set($event)">
      </app-tab-navigation>

      <div class="table-action-bar">
        <div class="search-wrapper">
          <mat-icon>search</mat-icon>
          <input type="text" placeholder="Search profiles..." (input)="onSearch($event)" />
        </div>

        <div class="action-group">
          <button class="filter-btn" [matMenuTriggerFor]="statusMenu">
            <span>{{ selectedFilter() === 'all' ? 'All' : (selectedFilter() | titlecase) }}</span>
            <mat-icon>expand_more</mat-icon>
          </button>

          <mat-menu #statusMenu="matMenu" class="custom-details-menu">
            <button mat-menu-item (click)="setFilter('all')">
              <mat-icon>list</mat-icon>
              <span>All</span>
            </button>
            <button mat-menu-item (click)="setFilter('active')">
              <mat-icon style="color: #05cd99">check_circle</mat-icon>
              <span>Active</span>
            </button>
            <button mat-menu-item (click)="setFilter('inactive')">
              <mat-icon style="color: #ee5d50">cancel</mat-icon>
              <span>Inactive</span>
            </button>
          </mat-menu>

          <button class="add-btn">
            <mat-icon>add</mat-icon>
            <span>ADD PROFILE</span>
          </button>
        </div>
      </div>

      <div class="table-card">
        <table mat-table [dataSource]="dataSource" class="premium-mat-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element" class="cell-name">
              {{ element.name || element.Name || 'N/A' }}
            </td>
          </ng-container>

          <ng-container matColumnDef="accountId">
            <th mat-header-cell *matHeaderCellDef>Account ID</th>
            <td mat-cell *matCellDef="let element" class="cell-mono">
              {{ element.id || element.Id }}
            </td>
          </ng-container>

          <ng-container matColumnDef="whatsapp">
            <th mat-header-cell *matHeaderCellDef>WhatsApp Number</th>
            <td mat-cell *matCellDef="let element">
              {{ element.whatsappNumber || element.WhatsAppNumber }}
            </td>
          </ng-container>

          <ng-container matColumnDef="phoneId">
            <th mat-header-cell *matHeaderCellDef>Phone ID</th>
            <td mat-cell *matCellDef="let element" class="cell-mono">
              {{ element.phoneNumberId || element.PhoneNumberId }}
            </td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let element">
              <span class="status-badge" [class.active]="element.isActive">
                <span class="dot"></span>
                {{ element.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
                <mat-icon>more_vert</mat-icon>
              </button>

              <mat-menu #menu="matMenu" class="custom-details-menu">
                <button
                  mat-menu-item
                  [routerLink]="['/business-details', element.id || element.Id]"
                >
                  <mat-icon class="menu-icon">visibility</mat-icon>
                  <span class="menu-text">View Details</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns"
            class="clickable-row"
            (click)="navigateToDetails(row.id || row.Id)"
          ></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[10, 20, 50]" class="custom-paginator"></mat-paginator>
      </div>
    </div>
  </div>
</div>
