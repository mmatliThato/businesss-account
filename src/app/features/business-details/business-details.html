<div class="screen-container">
  <div class="side-nav">
    <button class="back-link" [routerLink]="['/business-accounts']">
      <mat-icon>keyboard_backspace</mat-icon>
      <span>Back</span>
    </button>
  </div>

  <div class="content-frame">
    <div class="page-header">
      <h1>Business Profile</h1>
      <button class="update-btn">UPDATE</button>
    </div>

    <app-tab-navigation 
      [currentTab]="currentTab()" 
      (tabSelected)="currentTab.set($event)">
    </app-tab-navigation>

    <div class="tab-content">
      @if (currentTab() === 'profile') {
        <div class="profile-grid">
          
          <div class="left-col">
            <div class="details-card">
              <div class="card-title-row">
                <h3>Profile Details</h3>
                <span class="status-badge" [class.active]="getStatus()">
                  <span class="dot"></span> {{ getStatus() ? 'Active' : 'Inactive' }}
                </span>
              </div>
              
              <div class="info-group">
                <label>Display name</label>
                <p>{{ getDisplayName() }}</p>
              </div>
              <div class="info-group">
                <label>WhatsApp number</label>
                <p>{{ getWhatsAppNumber() }}</p>
              </div>
              <div class="info-group">
                <label>Date created</label>
                <p>12/03/2026</p>
              </div>
            </div>

            <div class="details-card api-summary">
              <h3>API Details</h3>
              <div class="info-group">
                <label>API name</label>
                <p>Populated</p>
              </div>
              <div class="info-group">
                <label>API key</label>
                <p class="mono">••••••••••••••••</p>
              </div>
              <div class="info-group">
                <label>API ID</label>
                <p class="mono">{{ getAccountId() }}</p>
              </div>
            </div>
          </div>

          <div class="right-col">
            <div class="form-card">
              <h3>Set-up API</h3>
              
              <div class="input-field">
                <label>API name</label>
                <input type="text" placeholder="Populated">
              </div>

              <div class="input-field">
                <label>Description</label>
                <input type="text" placeholder="Short description">
              </div>

              <div class="env-selector">
                <label class="radio-item">
                  <input type="radio" name="env" value="development" [checked]="apiEnvironment() === 'development'">
                  <span>Development</span>
                </label>
                <label class="radio-item">
                  <input type="radio" name="env" value="production" [checked]="apiEnvironment() === 'production'">
                  <span>Production</span>
                </label>
              </div>

              <hr class="divider">

              <h3>API Settings</h3>
              
              <div class="setting-row">
                <div class="setting-text">
                  <label>Reply callback</label>
                  <span>Specify callback return method</span>
                </div>
                <mat-slide-toggle color="primary"></mat-slide-toggle>
              </div>

              <div class="input-field">
                <label>Address</label>
                <input type="text" [ngModel]="apiAddress()" placeholder="API address">
              </div>

              <div class="dual-inputs">
                <div class="input-field">
                  <label>Client secret</label>
                  <input type="text" placeholder="Label">
                </div>
                <div class="input-field">
                  <label>Scope</label>
                  <input type="text" placeholder="Label">
                </div>
              </div>
            </div>
          </div>

        </div>
      }
    </div>
  </div>
</div>
